summary: Storefront CSP violation reports, including password reset tokens, sent to a third-party endpoint
details: >
  The module shipped an etc/config.xml that set the storefront CSP report_uri to a third-party
  uriports.com endpoint. Every CSP violation on the storefront was reported there, including the full
  page URL, which can contain sensitive data such as customer password reset tokens. Whoever controls
  that endpoint could use such a token to take over a customer account. The module also shipped an
  etc/csp_whitelist.xml that globally allowed Google, Google Tag Manager and PayPal (sandbox) hosts in
  script-src, weakening the storefront Content Security Policy. Neither file is needed for this CLI
  module. Version 0.0.3 removes both files. After upgrading, flush the Magento cache and check that
  csp/mode/storefront/report_uri is not still set to the uriports.com endpoint in core_config_data.
